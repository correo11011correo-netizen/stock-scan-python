name: Test Audit
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Ensure logs dir exists
        run: mkdir -p logs
      - name: Start server in background
        run: |
          nohup python3 main.py > logs/server_audit.log 2>&1 &
      - name: Wait for server to be ready
        run: |
          echo "Esperando a que el servidor inicie..."
          for i in {1..20}; do
            if curl -s http://localhost:8888/api/config > /dev/null; then
              echo "Servidor listo!"
              exit 0
            fi
            sleep 2
          done
          echo "Servidor no inició a tiempo."
          cat logs/server_audit.log
          exit 1
      - name: Run audit
        run: python3 ./audit/automated_audit.py
